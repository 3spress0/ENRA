name: Validate ENRA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Bash syntax
        run: bash -n enra.sh install.sh update.sh tests/check-firewall-policy.sh tests/integration-firewall.sh

      - name: Check firewall policy contract
        run: bash tests/check-firewall-policy.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nftables iproute2 iputils-ping

      - name: Run packet-level firewall integration tests
        run: sudo bash tests/integration-firewall.sh

      - name: Lint setup script
        run: shellcheck --severity=warning enra.sh install.sh update.sh tests/check-firewall-policy.sh tests/integration-firewall.sh
